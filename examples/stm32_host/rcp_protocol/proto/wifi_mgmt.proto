syntax = "proto3";

package ros.wifi.v1;

// -----------------------------------------------------------------------------
// Notes
// - This .proto mirrors Zephyr's wifi_mgmt API shapes for quick MCU mapping.
// - Do not use protobuf for the LP wire header (LP handles framing/seq/ack).
// - Use this .proto only for Wi-Fi control/events payloads on LCID 0x01.
// - 802.11/802.3 data goes on LCID 0x02 without protobuf.
// -----------------------------------------------------------------------------

// -----------------------------------------------------------------------------
// Enumerations (aligned to Zephyr headers; extended where useful)
// -----------------------------------------------------------------------------

enum WifiSecurityType {
  option allow_alias = true;
  WIFI_SECURITY_TYPE_NONE = 0;
  WIFI_SECURITY_TYPE_PSK = 1;   // WPA/WPA2 PSK (Zephyr lumps WPA2-PSK here)
  WIFI_SECURITY_TYPE_PSK_SHA256 = 2;
  WIFI_SECURITY_TYPE_SAE = 3;   // WPA3 SAE
  WIFI_SECURITY_TYPE_SAE_HNP = 3; // alias for WIFI_SECURITY_TYPE_SAE
  WIFI_SECURITY_TYPE_SAE_H2E = 4;
  WIFI_SECURITY_TYPE_SAE_AUTO = 5;
  WIFI_SECURITY_TYPE_WAPI = 6;
  WIFI_SECURITY_TYPE_EAP = 7;   // Enterprise (EAP)
  WIFI_SECURITY_TYPE_EAP_TLS = 7; // alias for WIFI_SECURITY_TYPE_EAP
  WIFI_SECURITY_TYPE_WEP = 8;
  WIFI_SECURITY_TYPE_WPA_PSK = 9;
  WIFI_SECURITY_TYPE_WPA_AUTO_PERSONAL = 10;
  WIFI_SECURITY_TYPE_DPP = 11;
  WIFI_SECURITY_TYPE_EAP_PEAP_MSCHAPV2 = 12;
  WIFI_SECURITY_TYPE_EAP_PEAP_GTC = 13;
  WIFI_SECURITY_TYPE_EAP_TTLS_MSCHAPV2 = 14;
  WIFI_SECURITY_TYPE_EAP_PEAP_TLS = 15;
  WIFI_SECURITY_TYPE_FT_PSK = 16;
  WIFI_SECURITY_TYPE_FT_SAE = 17;
  WIFI_SECURITY_TYPE_FT_EAP = 18;
  WIFI_SECURITY_TYPE_FT_EAP_SHA384 = 19;
  WIFI_SECURITY_TYPE_SAE_EXT_KEY = 20;
  WIFI_SECURITY_TYPE_UNKNOWN = 21;
  // Not supported directly by Zephyr.
  WIFI_SECURITY_TYPE_OSEN = 22;
  WIFI_SECURITY_TYPE_OWE = 23;
  WIFI_SECURITY_TYPE_WPA3_EAP_SUITE_B = 24;
}

enum WifiWpa3EnterpriseType {
  WIFI_WPA3_ENTERPRISE_TYPE_NA = 0;
  WIFI_WPA3_ENTERPRISE_TYPE_SUITEB = 1;
  WIFI_WPA3_ENTERPRISE_TYPE_SUITEB_192 = 2;
  WIFI_WPA3_ENTERPRISE_TYPE_WPA3_ONLY = 3;
}

enum WifiBand {
  WIFI_BAND_2_4_GHZ = 0;
  WIFI_BAND_5_GHZ = 1;
  WIFI_BAND_6_GHZ = 2;
  WIFI_BAND_UNKNOWN = 3;
  // Not supported directly by Zephyr
  WIFI_BAND_60_GHZ = 4;
  WIFI_BAND_ANY = 5;
}

enum WifiScanType {
  WIFI_SCAN_TYPE_PASSIVE = 0;
  WIFI_SCAN_TYPE_ACTIVE = 1;
}

enum WifiInterfaceState {
  option allow_alias = true;

  // NOTE: Values aligned with Zephyr's enum wifi_iface_state (include/zephyr/net/wifi.h)
  WIFI_STATE_DISCONNECTED = 0;
  WIFI_STATE_INTERFACE_DISABLED = 1;
  WIFI_STATE_INACTIVE = 2;
  WIFI_STATE_SCANNING = 3;
  WIFI_STATE_AUTHENTICATING = 4;
  WIFI_STATE_ASSOCIATING = 5;
  WIFI_STATE_ASSOCIATED = 6;
  WIFI_STATE_4WAY_HANDSHAKE = 7;
  WIFI_STATE_GROUP_HANDSHAKE = 8;
  WIFI_STATE_COMPLETED = 9;

  // Alias for legacy wording (Zephyr uses COMPLETED for "ready to pass data").
  WIFI_STATE_CONNECTED = 9;

  // Zephyr's WIFI_STATE_UNKNOWN is 11 (10 is reserved internally for __WIFI_STATE_AFTER_LAST).
  WIFI_STATE_UNKNOWN = 11;
}


enum WifiMfpOptions {
  WIFI_MFP_DISABLE = 0;
  WIFI_MFP_OPTIONAL = 1;
  WIFI_MFP_REQUIRED = 2;
}

enum WifiMode {
  option allow_alias = true;

  // NOTE: Values aligned with Zephyr's enum wifi_iface_mode (include/zephyr/net/wifi.h)
  WIFI_MODE_INFRA = 0;                 // STA
  WIFI_MODE_IBSS = 1;                  // IBSS (ad-hoc)
  WIFI_MODE_AP = 2;                    // SoftAP
  WIFI_MODE_P2P_GO = 3;                // P2P group owner
  WIFI_MODE_P2P_GROUP_FORMATION = 4;   // P2P client / group formation
  WIFI_MODE_MESH = 5;                  // 802.11s mesh

  // Legacy aliases used by some codebases
  WIFI_MODE_MESH_POINT = 5;
  WIFI_MODE_P2P_CLIENT = 4;
}


enum WifiLinkMode {
  // NOTE: Values aligned with Zephyr's enum wifi_link_mode (include/zephyr/net/wifi.h)
  WIFI_LINK_MODE_WIFI_0 = 0;   // 802.11 (legacy)
  WIFI_LINK_MODE_WIFI_1 = 1;   // 802.11b
  WIFI_LINK_MODE_WIFI_2 = 2;   // 802.11a
  WIFI_LINK_MODE_WIFI_3 = 3;   // 802.11g
  WIFI_LINK_MODE_WIFI_4 = 4;   // 802.11n (HT)
  WIFI_LINK_MODE_WIFI_5 = 5;   // 802.11ac (VHT)
  WIFI_LINK_MODE_WIFI_6 = 6;   // 802.11ax (HE)
  WIFI_LINK_MODE_WIFI_6E = 7;  // 802.11ax 6GHz (Wi-Fi 6E)
  WIFI_LINK_MODE_WIFI_7 = 8;   // 802.11be (EHT)

  // Zephyr's WIFI_LINK_MODE_UNKNOWN is 10 (9 is reserved internally for __WIFI_LINK_MODE_AFTER_LAST).
  WIFI_LINK_MODE_UNKNOWN = 10;
}


enum WifiPowerSaveType {
  WIFI_PS_TYPE_NONE = 0;
  WIFI_PS_TYPE_MODEM = 1;
  WIFI_PS_TYPE_WMM = 2; // U-APSD
}

enum WifiPsState {
  WIFI_PS_STATE_DISABLE = 0;
  WIFI_PS_STATE_ENABLE = 1;
}

enum WifiPsWakeupMode {
  WIFI_PS_WAKEUP_MODE_DTIM = 0;
  WIFI_PS_WAKEUP_MODE_LISTEN_INTERVAL = 1;
}

enum WifiFrequencyBandwidth {
  WIFI_FREQ_BANDWIDTH_UNKNOWN = 0;
  WIFI_FREQ_BANDWIDTH_20MHZ = 1;
  WIFI_FREQ_BANDWIDTH_40MHZ = 2;
  WIFI_FREQ_BANDWIDTH_80MHZ = 3;
  WIFI_FREQ_BANDWIDTH_160MHZ = 4;
  WIFI_FREQ_BANDWIDTH_80_80MHZ = 5;
}

enum WifiApStatus {
  WIFI_AP_STATUS_SUCCESS = 0;
  WIFI_AP_STATUS_FAIL = 1;
  WIFI_AP_STATUS_CHANNEL_NOT_SUPPORTED = 2;
  WIFI_AP_STATUS_CHANNEL_NOT_ALLOWED = 3;
  WIFI_AP_STATUS_SSID_NOT_ALLOWED = 4;
  WIFI_AP_STATUS_AUTH_TYPE_NOT_SUPPORTED = 5;
  WIFI_AP_STATUS_OP_NOT_SUPPORTED = 6;
  WIFI_AP_STATUS_OP_NOT_PERMITTED = 7;
}

enum WifiPsConfigFailReason {
  WIFI_PS_CONFIG_FAIL_REASON_NONE = 0;
  WIFI_PS_CONFIG_FAIL_REASON_INVALID_STATE = 1;
  WIFI_PS_CONFIG_FAIL_REASON_INVALID_LISTEN_INTERVAL = 2;
  WIFI_PS_CONFIG_FAIL_REASON_INVALID_WAKEUP_MODE = 3;
  WIFI_PS_CONFIG_FAIL_REASON_INVALID_PS_MODE = 4;
  WIFI_PS_CONFIG_FAIL_REASON_INVALID_TIMEOUT = 5;
  WIFI_PS_CONFIG_FAIL_REASON_NOT_SUPPORTED = 6;
  WIFI_PS_CONFIG_FAIL_REASON_UNKNOWN = 7;
}

enum WifiPsExitStrategy {
  WIFI_PS_EXIT_STRATEGY_PERIODIC = 0;
  WIFI_PS_EXIT_STRATEGY_ON_DEMAND = 1;
}

// Top-level opcodes for convenience (host can also infer from oneof)
enum RequestType {
  REQUEST_TYPE_UNKNOWN = 0;
  REQUEST_TYPE_CONNECT = 1;
  REQUEST_TYPE_DISCONNECT = 2;
  REQUEST_TYPE_SCAN = 3;
  REQUEST_TYPE_AP_ENABLE = 4;
  REQUEST_TYPE_AP_DISABLE = 5;
  REQUEST_TYPE_GET_WIFI_VERSION = 6;
  REQUEST_TYPE_SET_PS_CONFIG = 7;
  REQUEST_TYPE_GET_PS_CONFIG = 8;
  REQUEST_TYPE_SET_REG_DOMAIN = 9;
  REQUEST_TYPE_GET_REG_DOMAIN = 10;
  REQUEST_TYPE_GET_IFACE_STATUS = 11;
  REQUEST_TYPE_GET_PROTOCOL_VERSION = 12;
  REQUEST_TYPE_GET_INTERFACES = 13; // L2 inventory
}

// -----------------------------------------------------------------------------
// Structs
// -----------------------------------------------------------------------------

message WifiPsSettings {
  WifiPsState enabled = 1;
  WifiPsWakeupMode wakeup_mode = 2;
  uint32 listen_interval_beacons = 3;
  uint32 timeout_ms = 4;
  bool fail_all_scans_if_ps = 5;
  WifiPsConfigFailReason fail_reason = 6; // set on failure paths
  WifiPsExitStrategy exit_strategy = 7;
}

message WifiPowerSaveConfig {
  WifiPsSettings ps_settings = 1;
  WifiPowerSaveType type = 2;
}

message WifiBandChannel {
  WifiBand band = 1;
  uint32 channel = 2; // 0 means "any channel in band"
}

message WifiRegChanInfo {
  uint32 center_frequency_mhz = 1;
  uint32 max_power_dbm = 2;
  bool supported = 3;
  bool passive_only = 4;
  bool dfs = 5;
}

message WifiRegDomain {
  string country_code = 1; // ISO 3166-1 alpha-2
  bool force_update = 2;
  repeated WifiRegChanInfo channel_info = 3;
}

// -----------------------------------------------------------------------------
// Requests (host -> RCP)
// -----------------------------------------------------------------------------

message WifiConnectRequest {
  uint32 iface_index = 1;
  bytes ssid = 2;
  WifiSecurityType security_type = 3;
  bytes psk = 4; // for PSK/WEP
  bytes sae_password = 6;        // for SAE
  uint32 channel = 8;            // 0 => any
  bytes bssid = 9; // optional target BSSID (6 bytes)
  uint32 timeout_ms = 11;
  WifiMfpOptions mfp = 12;
  WifiBand band = 13;
  bytes anonymous_id = 14;       // EAP
  bytes key_password = 15;       // EAP
  bytes key2_password = 16;      // EAP
  WifiWpa3EnterpriseType wpa3_enterprise_type = 17;
  uint32 tls_cipher_suite = 18;  // optional
  uint32 eap_version = 19;       // optional
  bytes eap_identity = 20;       // EAP
  bytes eap_password = 21;       // EAP
  bool ft_enabled = 23;          // 802.11r FT
  bool ignore_broadcast_ssid = 26;
  WifiFrequencyBandwidth bandwidth = 27;
}

message WifiDisconnectRequest {
  uint32 iface_index = 1;
}

message WifiScanParams {
  WifiScanType scan_type = 1;
  uint32 bands_bitmap = 2;           // OR of WifiBand values
  uint32 dwell_time_active_ms = 3;
  uint32 dwell_time_passive_ms = 4;
  repeated bytes ssids = 5;          // directed scan SSIDs (<=32B each)
  uint32 max_bss_cnt = 6;            // hint
  repeated WifiBandChannel band_chan = 7;
}

message WifiScanRequest {
  uint32 iface_index = 1;
  WifiScanParams params = 2;
}

message WifiApEnableParams {
  bytes ssid = 1;
  uint32 channel = 2;
  WifiBand band = 3;
  WifiSecurityType security_type = 4;
  bytes psk = 5;                 // if security requires it
  bool hidden_ssid = 6;
  uint32 beacon_interval_tu = 7; // default 100
  uint32 dtim_period = 8;        // default 1..2
}

message WifiApEnableRequest {
  uint32 iface_index = 1;
  WifiApEnableParams params = 2;
}

message WifiApDisableRequest {
  uint32 iface_index = 1;
}

message GetWifiVersionRequest {}
message SetPowerSaveConfigRequest { uint32 iface_index = 1; WifiPowerSaveConfig config = 2; }
message GetPowerSaveConfigRequest { uint32 iface_index = 1; }
message SetRegulatoryDomainRequest { uint32 iface_index = 1; WifiRegDomain reg_domain = 2; }
message GetRegulatoryDomainRequest { uint32 iface_index = 1; }
message GetInterfaceStatusRequest { uint32 iface_index = 1; }

// L2 inventory
enum NetIfType {
  NET_IF_TYPE_UNKNOWN = 0;
  NET_IF_TYPE_WIFI = 1;
  NET_IF_TYPE_OPENTHREAD = 2;
}

enum NetIfOperState {
  NET_IF_OPER_STATE_UNKNOWN = 0;
  NET_IF_OPER_STATE_NOTPRESENT = 1;
  NET_IF_OPER_STATE_DOWN = 2;
  NET_IF_OPER_STATE_LOWERLAYERDOWN = 3;
  NET_IF_OPER_STATE_TESTING = 4;
  NET_IF_OPER_STATE_DORMANT = 5;
  NET_IF_OPER_STATE_UP = 6;
}

message RequestInterfaces {
  NetIfType net_if_type = 1; // UNKNOWN => all
  uint32 index = 2;          // 0 => any
}

// -----------------------------------------------------------------------------
// Responses (RCP -> host)
// -----------------------------------------------------------------------------

message WifiStatusResponse {
  bool success = 1;
  int32 error_code = 2;      // Zephyr errno (0=OK, negative on error)
  string error_message = 3;  // optional
}

message WifiVersion {
  uint32 driver_major = 1;
  uint32 driver_minor = 2;
  uint32 driver_patch = 3;
  string firmware_version = 4;
}

message GetWifiVersionResponse { WifiVersion version = 1; }
message GetRegulatoryDomainResponse { WifiRegDomain reg_domain = 1; }

message WifiInterfaceStatus {
  WifiInterfaceState state = 1;
  WifiMode mode = 2;
  bytes ssid = 3;
  bytes bssid = 4;               // 6 bytes
  uint32 channel = 5;
  WifiSecurityType security = 6;
  WifiMfpOptions mfp = 7;
  int32 rssi = 8;                // dBm
  WifiLinkMode link_mode = 9;
  uint32 ht_mcs = 10;
  uint32 vht_mcs = 11;
  uint32 he_mcs = 12;
  uint32 tx_bitrate_kbps = 13;
  uint32 rx_bitrate_kbps = 14;
  WifiBand band = 15;
  WifiWpa3EnterpriseType wpa3_enterprise_type = 16;
  uint32 dtim_period = 17;
  uint32 beacon_interval = 18;   // TU
  bool twt_capable = 19;
}

message GetInterfaceStatusResponse { WifiInterfaceStatus status = 1; }

message GetPowerSaveConfigResponse {
  WifiPowerSaveConfig config = 1;
  WifiStatusResponse status = 2; // for errno / fail_reason
}

// L2 inventory
message NetworkInterface {
  uint32 index = 1;
  NetIfType net_if_type = 2;
  bytes mac_address = 3; // 6 bytes
  bool offload_supported = 4;
  uint32 mtu = 5;
}
message RequestInterfacesResponse { repeated NetworkInterface net_ifs = 1; }

// -----------------------------------------------------------------------------
// Events / notifications (RCP -> host async)
// -----------------------------------------------------------------------------

message WifiScanResult {
  bytes ssid = 1;
  bytes bssid = 2;          // 6 bytes
  uint32 channel = 3;
  int32 rssi = 4;           // dBm
  WifiSecurityType security = 5;
  WifiWpa3EnterpriseType wpa3_enterprise_type = 6;
  WifiMfpOptions mfp = 7;
  WifiBand band = 8;
}

message ScanDoneEvent {
  int32 status = 1; // 0=OK, negative errno for fail/abort
  repeated WifiScanResult all_results = 2; // may be empty if streamed per-result
}

message ConnectResultEvent { int32 status = 1; }
message DisconnectResultEvent {
  bool initiated_by_user = 1;
  uint32 reason_code = 2;   // IEEE 802.11 reason if available
}

message InterfaceStatusEvent { WifiInterfaceStatus status = 1; }
message ApEnableResultEvent { int32 status = 1; }
message ApDisableResultEvent { int32 status = 1; }
message ApStaConnectedEvent { bytes sta_mac_address = 1; }
message ApStaDisconnectedEvent { bytes sta_mac_address = 1; }

message WifiEvent {
  uint32 iface_index = 1;
  oneof event_data {
    ScanDoneEvent scan_done_event = 2;
    ConnectResultEvent connect_result_event = 3;
    DisconnectResultEvent disconnect_result_event = 4;
    InterfaceStatusEvent interface_status_event = 5;
    ApEnableResultEvent ap_enable_result_event = 6;
    ApDisableResultEvent ap_disable_result_event = 7;
    ApStaConnectedEvent ap_sta_connected_event = 8;
    ApStaDisconnectedEvent ap_sta_disconnected_event = 9;
    WifiScanResult scan_result_event = 10;
  }
}

// -----------------------------------------------------------------------------
// Top-level request/response wrappers
// - txn_id correlates req/resp; op is informational
// -----------------------------------------------------------------------------

message WifiMgmtRequest {
  uint32 txn_id = 1;     // host-chosen transaction id
  RequestType op = 2;    // optional hint; receiver may ignore and infer from oneof

  oneof payload {
    WifiConnectRequest connect = 10;
    WifiDisconnectRequest disconnect = 11;
    WifiScanRequest scan = 12;
    WifiApEnableRequest ap_enable = 13;
    WifiApDisableRequest ap_disable = 14;
    GetWifiVersionRequest get_version = 15;
    SetPowerSaveConfigRequest set_ps_config = 16;
    GetPowerSaveConfigRequest get_ps_config = 17;
    SetRegulatoryDomainRequest set_reg_domain = 18;
    GetRegulatoryDomainRequest get_reg_domain = 19;
    GetInterfaceStatusRequest get_iface_status = 20;

    // L2 inventory
    RequestInterfaces get_l2_interfaces = 30;
  }
}

message ProtocolVersionResponse {
  uint32 major = 1;
  uint32 minor = 2;
}

message WifiMgmtResponse {
  uint32 txn_id = 1;

  // Always include a status for simple callers
  WifiStatusResponse status = 2;

  oneof payload {
    GetWifiVersionResponse version = 10;
    GetRegulatoryDomainResponse reg_domain = 11;
    GetInterfaceStatusResponse iface_status = 12;
    GetPowerSaveConfigResponse ps_config = 13;

    // L2 inventory
    RequestInterfacesResponse l2_interfaces = 30;

    // Protocol version (if requested via op == REQUEST_TYPE_GET_PROTOCOL_VERSION)
    ProtocolVersionResponse proto_version = 40;
  }
}

// Async notify wrapper (RCP -> host, independent of txn_id)
message WifiMgmtNotification {
  WifiEvent event = 1;
}

/* MCU -> Host message container. */
message WifiMgmtUplink {
  oneof payload {
    WifiMgmtNotification notification = 1;
    WifiMgmtResponse response = 2;
  }
}
